<!doctype html>
<!-- 디스콰이엇·목록용 정사각 썸네일. 1024×1024로 찍는다(scripts/render-images.sh). 쿼카 캐릭터는 넣지 않는다 -->
<html lang="ko"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1024px;height:1024px;background:#1d1d1b;font-family:"Apple SD Gothic Neo",-apple-system,sans-serif}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px}
.cal{width:560px;height:560px;border-radius:64px;background:#fbfaf7;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45);display:flex;flex-direction:column}
.top{height:150px;background:#c8412f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:700;letter-spacing:2px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:300px;line-height:1;font-weight:800;color:#c8412f;margin-top:-10px}
.name{font-size:62px;font-weight:700;color:#3a3833;margin-top:8px}
.label{color:#ecebe6;font-size:76px;font-weight:700;letter-spacing:1px}
.label span{color:#e2b04a}
</style></head><body>
<div class="wrap">
  <div class="cal"><div class="top">2026. 5월</div><div class="day"><div class="num">1</div><div class="name">노동절</div></div></div>
  <div class="label">Korea Tools <span>MCP</span></div>
</div>
</body></html>
